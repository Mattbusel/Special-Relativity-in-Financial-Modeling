<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tokio Prompt — Relativistic Market Intelligence</title>
    <style>
      /* ── Theme tokens ─────────────────────────────────── */
      :root,
      [data-theme="dark"] {
        --bg: #0a0a0a;
        --bg-panel: #0d0d1a;
        --border: #1a1a2e;
        --text: #e0e0e0;
        --text-muted: #888888;
      }
      [data-theme="light"] {
        --bg: #f0f4f8;
        --bg-panel: #ffffff;
        --border: #d0d8e4;
        --text: #1a1a2e;
        --text-muted: #555577;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body, #root {
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
        overflow: hidden;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #111;
      }
      ::-webkit-scrollbar-thumb {
        background: #00ffff44;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00ffff88;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
