[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "srfm-validation"
version = "1.0.0"
description = "Validation and figure-generation scripts for Special Relativity in Financial Modeling"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["finance", "special-relativity", "lorentz", "quantitative"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.optional-dependencies]
data = [
    "yfinance>=0.2",
]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.1",
    "mypy>=1.0",
]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme>=1.3",
    "myst-parser>=2",
]

[project.scripts]
srfm-validate = "validation.run_validation:main"
srfm-analyze  = "validation.analyze_q1:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["validation*", "paper*"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-v --tb=short"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
