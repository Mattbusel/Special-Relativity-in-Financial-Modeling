name: Python Validation

on:
  push:
    paths:
      - 'validation/pytest/**'
      - 'tests/fixtures/**'
      - '.github/workflows/python.yml'
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r validation/requirements.txt

      - name: Run pytest
        shell: bash
        run: |
          # Tests listed in ci/known-failing-pytest.txt fail today and are tracked there.
          args=()
          while read -r t; do
            case "$t" in ''|\#*) continue;; esac
            args+=(--deselect "$t")
          done < <(tr -d '\r' < ci/known-failing-pytest.txt)
          pytest validation/pytest/ -v "${args[@]}"
