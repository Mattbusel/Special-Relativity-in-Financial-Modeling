name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CMAKE_BUILD_TYPE: RelWithDebInfo

jobs:
  # ---------------------------------------------------------------------------
  # Linux: configure, build (C++20), run tests, static analysis
  # ---------------------------------------------------------------------------
  linux:
    name: "Linux (${{ matrix.compiler }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc-12, clang-17]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install GCC-12
        if: matrix.compiler == 'gcc-12'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-12 g++-12 cmake ninja-build clang-format cppcheck valgrind doxygen

      - name: Install Clang-17
        if: matrix.compiler == 'clang-17'
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 17
          sudo apt-get install -y clang-17 clang-tidy-17 clang-format-17 cmake ninja-build
          sudo ln -sf /usr/bin/clang-format-17 /usr/bin/clang-format

      - name: Set compiler env (GCC)
        if: matrix.compiler == 'gcc-12'
        run: |
          echo "CC=gcc-12"     >> "$GITHUB_ENV"
          echo "CXX=g++-12"   >> "$GITHUB_ENV"

      - name: Set compiler env (Clang)
        if: matrix.compiler == 'clang-17'
        run: |
          echo "CC=clang-17"    >> "$GITHUB_ENV"
          echo "CXX=clang++-17" >> "$GITHUB_ENV"

      - name: Cache CMake build artifacts
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-${{ matrix.compiler }}-${{ env.CMAKE_BUILD_TYPE }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-${{ env.CMAKE_BUILD_TYPE }}-

      - name: CMake configure (C++20)
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests (ctest)
        run: ctest --test-dir build --output-on-failure --parallel 4

      - name: clang-tidy static analysis
        if: matrix.compiler == 'clang-17'
        run: |
          find src -name '*.cpp' ! -path '*/simd/*' | \
            xargs clang-tidy-17 \
              -p build \
              --warnings-as-errors='' \
              --extra-arg=-std=c++20 \
              2>&1 | tee clang-tidy-report.txt
          echo "clang-tidy completed"

      - name: cppcheck static analysis
        if: matrix.compiler == 'gcc-12'
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --std=c++20 \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            -I include \
            -I src \
            src/ \
            2>&1 | tee cppcheck-report.txt

      - name: clang-format lint
        run: |
          # Collect all project C++ sources (exclude third_party and build/)
          FILES=$(find include src -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) \
                    ! -path '*/third_party/*' ! -path '*/build/*')
          if [ -z "$FILES" ]; then
            echo "No files to format-check."
            exit 0
          fi
          RESULT=0
          for f in $FILES; do
            diff_out=$(clang-format --style=file --dry-run --Werror "$f" 2>&1 || true)
            if [ -n "$diff_out" ]; then
              echo "clang-format violation: $f"
              echo "$diff_out"
              RESULT=1
            fi
          done
          if [ $RESULT -ne 0 ]; then
            echo ""
            echo "Fix with: clang-format --style=file -i <file>"
            exit 1
          fi
          echo "All files pass clang-format."

      - name: Valgrind memory check
        if: matrix.compiler == 'gcc-12'
        run: |
          # Run the unit-test executables under Valgrind to detect leaks and
          # invalid memory accesses.  The build was already done above.
          valgrind \
            --error-exitcode=1 \
            --leak-check=full \
            --show-leak-kinds=definite,indirect \
            --track-origins=yes \
            --suppressions=/usr/lib/valgrind/debian.supp \
            build/test_momentum 2>&1 | tee valgrind-momentum.txt
          valgrind \
            --error-exitcode=1 \
            --leak-check=full \
            --show-leak-kinds=definite,indirect \
            --track-origins=yes \
            build/test_edge_cases 2>&1 | tee valgrind-edge.txt
          echo "Valgrind checks passed."

      - name: Generate Doxygen documentation
        if: matrix.compiler == 'gcc-12'
        run: |
          doxygen Doxyfile
          echo "Doxygen docs generated at docs/api/html/index.html"

      - name: Upload Doxygen documentation
        if: matrix.compiler == 'gcc-12'
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-api-docs
          path: docs/api/html/
          retention-days: 14

      - name: Upload analysis reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-${{ matrix.compiler }}
          path: |
            build/Testing/
            clang-tidy-report.txt
            cppcheck-report.txt
            valgrind-momentum.txt
            valgrind-edge.txt

  # ---------------------------------------------------------------------------
  # Windows: configure, build (C++20), run tests
  # ---------------------------------------------------------------------------
  windows:
    name: "Windows (MSVC)"
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache CMake build artifacts
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-msvc-RelWithDebInfo-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-msvc-RelWithDebInfo-

      - name: CMake configure (C++20)
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Run tests (ctest)
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

  # ---------------------------------------------------------------------------
  # Address + Undefined Behaviour sanitisers (Clang-17, Linux)
  # ---------------------------------------------------------------------------
  sanitisers:
    name: "ASAN + UBSAN (clang-17)"
    runs-on: ubuntu-latest
    needs: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Clang-17
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 17
          sudo apt-get install -y clang-17 cmake ninja-build

      - name: CMake configure (ASAN + UBSAN)
        run: |
          cmake -S . -B build_san \
            -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-17 \
            -DCMAKE_C_COMPILER=clang-17 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build (sanitised)
        run: cmake --build build_san --parallel

      - name: Run tests (sanitised)
        env:
          ASAN_OPTIONS: "halt_on_error=1:detect_leaks=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: ctest --test-dir build_san --output-on-failure --parallel 4

  # ---------------------------------------------------------------------------
  # Thread sanitiser (Clang-17, Linux)
  # ---------------------------------------------------------------------------
  tsan:
    name: "TSAN (clang-17)"
    runs-on: ubuntu-latest
    needs: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Clang-17
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 17
          sudo apt-get install -y clang-17 cmake ninja-build

      - name: CMake configure (TSAN)
        run: |
          cmake -S . -B build_tsan \
            -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-17 \
            -DCMAKE_C_COMPILER=clang-17 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build (TSAN)
        run: cmake --build build_tsan --parallel

      - name: Run tests (TSAN)
        env:
          TSAN_OPTIONS: "halt_on_error=1"
        run: ctest --test-dir build_tsan --output-on-failure --parallel 4
