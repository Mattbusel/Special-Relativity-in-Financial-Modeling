name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The C++ core, built exactly as the README documents it.
  cpp:
    name: C++ (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux, GCC, Ninja
            os: ubuntu-latest
            configure: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
            build: cmake --build build --parallel
            test: ctest --test-dir build --output-on-failure --timeout 120
          - name: Windows, MSVC
            os: windows-latest
            configure: cmake -B build -G "Visual Studio 17 2022" -A x64
            build: cmake --build build --config Release --parallel
            test: ctest --test-dir build -C Release --output-on-failure --timeout 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build
      - name: Configure
        run: ${{ matrix.configure }}
      - name: Build
        run: ${{ matrix.build }}
      - name: Test
        shell: bash
        run: |
          # Suites listed in ci/known-failing-tests.txt fail on main today and
          # are tracked there; everything else must pass.
          skip=$(tr -d '\r' < ci/known-failing-tests.txt | grep -v '^#' | grep -v '^\s*$' | paste -sd'|' -)
          if [ -n "$skip" ]; then
            ${{ matrix.test }} -E "^(${skip})$"
          else
            ${{ matrix.test }}
          fi
      - name: Run the regime validator on committed SPY data
        shell: bash
        run: |
          dir=build; [ -d build/Release ] && dir=build/Release
          "$dir/srfm" --help
          "$dir/regime_validator" --input validation/data/SPY_1m.csv --output spy_regime.csv --ticker SPY
          head -5 spy_regime.csv

  # Experimental Rust layer: must compile; library unit tests must pass.
  rust:
    name: Rust (library)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install egui system deps
        run: sudo apt-get update -qq && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev
      - name: cargo check (all features)
        run: cargo check --all-features --lib --bins
      - name: cargo test (library)
        shell: bash
        run: |
          args=()
          while read -r t; do
            case "$t" in ''|\#*) continue;; esac
            args+=(--skip "$t")
          done < <(tr -d '\r' < ci/known-failing-rust-tests.txt)
          cargo test --lib --all-features -- "${args[@]}"
