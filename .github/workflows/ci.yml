name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel in-progress runs for the same branch/PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Linux: Debug + Release builds, ctest, clang-tidy, cppcheck, Doxygen
  # ─────────────────────────────────────────────────────────────────────────────
  linux:
    name: "Linux (${{ matrix.compiler }}, ${{ matrix.build_type }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc-12, clang-17]
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install GCC-12 toolchain
        if: matrix.compiler == 'gcc-12'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            gcc-12 g++-12 \
            cmake ninja-build \
            clang-format cppcheck \
            valgrind doxygen \
            libeigen3-dev

      - name: Install Clang-17 toolchain
        if: matrix.compiler == 'clang-17'
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 17
          sudo apt-get install -y \
            clang-17 clang-tidy-17 clang-format-17 \
            cmake ninja-build \
            libeigen3-dev
          sudo ln -sf /usr/bin/clang-format-17  /usr/bin/clang-format
          sudo ln -sf /usr/bin/clang-tidy-17    /usr/bin/clang-tidy

      - name: Set compiler env (GCC)
        if: matrix.compiler == 'gcc-12'
        run: |
          echo "CC=gcc-12"   >> "$GITHUB_ENV"
          echo "CXX=g++-12"  >> "$GITHUB_ENV"

      - name: Set compiler env (Clang)
        if: matrix.compiler == 'clang-17'
        run: |
          echo "CC=clang-17"    >> "$GITHUB_ENV"
          echo "CXX=clang++-17" >> "$GITHUB_ENV"

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build-${{ matrix.compiler }}-${{ matrix.build_type }}
          key: >
            ${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-
            ${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-

      - name: CMake configure
        run: |
          cmake -S . \
            -B build-${{ matrix.compiler }}-${{ matrix.build_type }} \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DSRFM_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: |
          cmake --build build-${{ matrix.compiler }}-${{ matrix.build_type }} \
            --parallel

      - name: Run tests (ctest)
        run: |
          ctest \
            --test-dir build-${{ matrix.compiler }}-${{ matrix.build_type }} \
            --output-on-failure \
            --parallel 4

      # clang-tidy — only on Clang Release (avoids Debug symbol noise)
      - name: clang-tidy static analysis
        if: matrix.compiler == 'clang-17' && matrix.build_type == 'Release'
        run: |
          find src include -name '*.cpp' ! -path '*/simd/*' | \
            xargs clang-tidy \
              -p build-${{ matrix.compiler }}-${{ matrix.build_type }} \
              --extra-arg=-std=c++20 \
              2>&1 | tee clang-tidy-report.txt
          echo "clang-tidy completed"

      # cppcheck — only on GCC Debug (complementary checker)
      - name: cppcheck static analysis
        if: matrix.compiler == 'gcc-12' && matrix.build_type == 'Debug'
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --std=c++20 \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            -I include \
            -I src \
            src/ \
            2>&1 | tee cppcheck-report.txt

      # clang-format lint (once, on GCC Debug to avoid duplication)
      - name: clang-format lint
        if: matrix.compiler == 'gcc-12' && matrix.build_type == 'Debug'
        run: |
          FILES=$(find include src -type f \
                    \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) \
                    ! -path '*/third_party/*' ! -path '*/build*')
          if [ -z "$FILES" ]; then echo "No files to check."; exit 0; fi
          RESULT=0
          for f in $FILES; do
            diff_out=$(clang-format --style=file --dry-run --Werror "$f" 2>&1 || true)
            if [ -n "$diff_out" ]; then
              echo "clang-format violation: $f"
              echo "$diff_out"
              RESULT=1
            fi
          done
          [ $RESULT -eq 0 ] && echo "All files pass clang-format." || exit 1

      # Valgrind — only GCC Debug (slower, comprehensive leak check)
      - name: Valgrind memory check
        if: matrix.compiler == 'gcc-12' && matrix.build_type == 'Debug'
        run: |
          valgrind \
            --error-exitcode=1 \
            --leak-check=full \
            --show-leak-kinds=definite,indirect \
            --track-origins=yes \
            --suppressions=/usr/lib/valgrind/debian.supp \
            build-${{ matrix.compiler }}-${{ matrix.build_type }}/test_momentum \
            2>&1 | tee valgrind-momentum.txt
          echo "Valgrind checks passed."

      # Doxygen — once, on GCC Release
      - name: Generate Doxygen documentation
        if: matrix.compiler == 'gcc-12' && matrix.build_type == 'Release'
        run: |
          doxygen Doxyfile
          echo "Doxygen docs at docs/api/html/index.html"

      - name: Upload Doxygen artifacts
        if: matrix.compiler == 'gcc-12' && matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-api-docs
          path: docs/api/html/
          retention-days: 14

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: |
            build-${{ matrix.compiler }}-${{ matrix.build_type }}/Testing/
            clang-tidy-report.txt
            cppcheck-report.txt
            valgrind-momentum.txt

  # ─────────────────────────────────────────────────────────────────────────────
  # Windows: Debug + Release builds, ctest
  # ─────────────────────────────────────────────────────────────────────────────
  windows:
    name: "Windows (MSVC, ${{ matrix.build_type }})"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build-msvc-${{ matrix.build_type }}
          key: >
            ${{ runner.os }}-msvc-${{ matrix.build_type }}-
            ${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-msvc-${{ matrix.build_type }}-

      - name: CMake configure
        run: |
          cmake -S . -B build-msvc-${{ matrix.build_type }} `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DSRFM_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: |
          cmake --build build-msvc-${{ matrix.build_type }} `
            --config ${{ matrix.build_type }} `
            --parallel

      - name: Run tests (ctest)
        run: |
          ctest `
            --test-dir build-msvc-${{ matrix.build_type }} `
            -C ${{ matrix.build_type }} `
            --output-on-failure

  # ─────────────────────────────────────────────────────────────────────────────
  # Address + Undefined Behaviour Sanitisers (Clang-17, Debug)
  # ─────────────────────────────────────────────────────────────────────────────
  asan-ubsan:
    name: "ASAN + UBSAN (clang-17)"
    runs-on: ubuntu-latest
    needs: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Clang-17 + Eigen
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 17
          sudo apt-get install -y clang-17 cmake ninja-build libeigen3-dev

      - name: CMake configure (ASAN + UBSAN)
        run: |
          cmake -S . -B build-asan \
            -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-17 \
            -DCMAKE_C_COMPILER=clang-17 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DSRFM_WARNINGS_AS_ERRORS=ON

      - name: Build (sanitised)
        run: cmake --build build-asan --parallel

      - name: Run tests (ASAN + UBSAN)
        env:
          ASAN_OPTIONS: "halt_on_error=1:detect_leaks=1:abort_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1:abort_on_error=1"
        run: ctest --test-dir build-asan --output-on-failure --parallel 4

  # ─────────────────────────────────────────────────────────────────────────────
  # Thread Sanitiser (Clang-17, Debug)
  # ─────────────────────────────────────────────────────────────────────────────
  tsan:
    name: "TSAN (clang-17)"
    runs-on: ubuntu-latest
    needs: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Clang-17 + Eigen
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 17
          sudo apt-get install -y clang-17 cmake ninja-build libeigen3-dev

      - name: CMake configure (TSAN)
        run: |
          cmake -S . -B build-tsan \
            -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-17 \
            -DCMAKE_C_COMPILER=clang-17 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
            -DSRFM_WARNINGS_AS_ERRORS=ON

      - name: Build (TSAN)
        run: cmake --build build-tsan --parallel

      - name: Run tests (TSAN)
        env:
          TSAN_OPTIONS: "halt_on_error=1:abort_on_error=1"
        run: ctest --test-dir build-tsan --output-on-failure --parallel 4

  # ─────────────────────────────────────────────────────────────────────────────
  # Sanitizer CI scripts (ci/run_asan.sh, ci/run_tsan.sh)
  # ─────────────────────────────────────────────────────────────────────────────
  sanitizers:
    name: "Sanitizers (${{ matrix.sanitizer }})"
    runs-on: ubuntu-latest
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, tsan]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Clang-17 + Eigen
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 17
          sudo apt-get install -y clang-17 cmake ninja-build libeigen3-dev
          echo "CC=clang-17"    >> "$GITHUB_ENV"
          echo "CXX=clang++-17" >> "$GITHUB_ENV"

      - name: Run ${{ matrix.sanitizer }}
        run: bash ci/run_${{ matrix.sanitizer }}.sh

  # ─────────────────────────────────────────────────────────────────────────────
  # Standalone clang-tidy job (separate blocking gate)
  # ─────────────────────────────────────────────────────────────────────────────
  clang-tidy:
    name: "clang-tidy"
    runs-on: ubuntu-latest
    needs: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Clang-17 + Eigen
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 17
          sudo apt-get install -y clang-17 clang-tidy-17 cmake ninja-build libeigen3-dev
          sudo ln -sf /usr/bin/clang-tidy-17 /usr/bin/clang-tidy

      - name: Configure (generate compile_commands.json)
        run: |
          cmake -S . -B build-tidy \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-17 \
            -DCMAKE_C_COMPILER=clang-17 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: |
          find src include -name '*.cpp' ! -path '*/simd/*' | \
            xargs clang-tidy \
              -p build-tidy \
              --extra-arg=-std=c++20 \
              2>&1 | tee clang-tidy-standalone-report.txt || true
          echo "clang-tidy scan complete"

      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-standalone-report
          path: clang-tidy-standalone-report.txt
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Fuzz targets — smoke run (30 s each)
  # ─────────────────────────────────────────────────────────────────────────────
  fuzz:
    name: "Fuzz smoke (clang-17)"
    runs-on: ubuntu-latest
    needs: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Clang-17 + Eigen
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 17
          sudo apt-get install -y clang-17 cmake ninja-build libeigen3-dev

      - name: Build fuzz targets
        run: |
          cmake -S . -B build-fuzz \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-17 \
            -DCMAKE_C_COMPILER=clang-17 \
            -DSRFM_FUZZ=ON
          cmake --build build-fuzz --parallel \
            --target fuzz_beta_calculator fuzz_manifold fuzz_geodesic fuzz_engine

      - name: Run fuzz smoke (30 s each)
        run: |
          for t in build-fuzz/fuzz_beta_calculator build-fuzz/fuzz_manifold \
                   build-fuzz/fuzz_geodesic build-fuzz/fuzz_engine; do
            echo "── Fuzzing $t (30 s) ──"
            timeout 30 "$t" -max_total_time=30 || true
          done

  # ─────────────────────────────────────────────────────────────────────────────
  # Python validation suite (pytest)
  # ─────────────────────────────────────────────────────────────────────────────
  python-tests:
    name: "Python tests (3.11)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest --tb=short -v

  # ─────────────────────────────────────────────────────────────────────────────
  # Final gate — all required jobs must pass
  # ─────────────────────────────────────────────────────────────────────────────
  all-checks:
    name: "All checks passed"
    runs-on: ubuntu-latest
    needs:
      - linux
      - windows
      - asan-ubsan
      - tsan
      - sanitizers
      - clang-tidy
      - fuzz
    steps:
      - name: Success
        run: echo "All CI jobs passed."
